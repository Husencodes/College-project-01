<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ganesh 3D — Combined Project</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; font-family: Arial, sans-serif; color: #fff7e6; background: radial-gradient(circle at top, #7d2414, #160807 65%); }
    main { width: min(900px, 100%); text-align: center; }
    h1 { font-size: clamp(2rem, 6vw, 4.5rem); margin: 0; color: #ffd36d; }
    p { font-size: 1.1rem; line-height: 1.6; }
    .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 20px; margin-top: 36px; }
    a { display: block; padding: 28px; min-height: 170px; text-decoration: none; border-radius: 18px; color: inherit; background: rgba(255,255,255,.08); border: 1px solid rgba(255,211,109,.55); transition: transform .2s, background .2s; }
    a:hover, a:focus { transform: translateY(-5px); background: rgba(255,211,109,.16); }
    h2 { color: #ffd36d; margin-top: 0; }
  </style>
</head>
<body>
  <main>
    <h1>ॐ Ganesh 3D</h1>
    <p>Choose an experience from the combined college project.</p>
    <div class="cards">
      <a href="main-site/index.html"><h2>Full Festival Website</h2><p>Explore the home page, information, quiz, memories, gallery, and contact sections.</p></a>
    </div>
  </main>
</body>
</html>
